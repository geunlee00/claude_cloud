<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="고정지출">
  <title>고정지출 체크</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="view-month">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="4"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/><path d="M9 15l2 2 4-4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/></symbol>
  </svg>

  <main>
    <!-- ───── 이번 달 ───── -->
    <section id="view-month" class="view active">
      <header class="page-head">
        <div class="month-switch">
          <button class="icon-btn ghost" id="prev-month" aria-label="이전 달"><svg><use href="#i-left"/></svg></button>
          <button class="month-title" id="month-label" aria-label="이번 달로 이동"></button>
          <button class="icon-btn ghost" id="next-month" aria-label="다음 달"><svg><use href="#i-right"/></svg></button>
        </div>
        <button class="icon-btn add" data-action="add" aria-label="고정지출 추가"><svg><use href="#i-plus"/></svg></button>
      </header>

      <div class="card hero">
        <span class="label" id="hero-label">이번 달 고정지출</span>
        <strong class="big-num" id="sum-total">0원</strong>
        <div class="hero-sub" id="hero-sub"></div>
        <button class="next-pay" id="next-pay" hidden></button>
      </div>

      <div class="card calendar">
        <div class="cal-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <div id="day-filter" class="filter-chip" hidden></div>
      <div id="month-groups"></div>

      <div class="empty" id="month-empty" hidden>
        <div class="empty-emoji">🗓️</div>
        <p class="empty-title">이번 달 고정지출이 없어요</p>
        <p class="empty-desc">월세, 구독료처럼 매달 나가는 돈을 등록해 보세요</p>
        <button class="btn primary" data-action="add">고정지출 추가하기</button>
      </div>
    </section>

    <!-- ───── 항목 ───── -->
    <section id="view-items" class="view">
      <header class="page-head">
        <h1>고정지출</h1>
        <button class="icon-btn add" data-action="add" aria-label="고정지출 추가"><svg><use href="#i-plus"/></svg></button>
      </header>

      <div class="card hero" id="items-hero">
        <span class="label">한 달 평균 고정지출</span>
        <strong class="big-num" id="avg-monthly">0원</strong>
        <span class="hero-sub" id="sum-yearly"></span>
        <div class="stack-bar" id="stack-bar"></div>
        <div class="legend" id="legend"></div>
      </div>

      <div id="item-groups"></div>

      <div class="empty" id="items-empty" hidden>
        <div class="empty-emoji">📋</div>
        <p class="empty-title">등록된 고정지출이 없어요</p>
        <p class="empty-desc">오른쪽 위 + 버튼으로 추가할 수 있어요</p>
        <button class="btn primary" data-action="add">고정지출 추가하기</button>
      </div>
    </section>

    <!-- ───── 설정 ───── -->
    <section id="view-settings" class="view">
      <header class="page-head"><h1>설정</h1></header>

      <div class="card stats" id="stats"></div>

      <p class="group-label">백업</p>
      <div class="card menu">
        <button class="menu-row" id="export-btn">
          <span class="menu-ico blue"><svg><use href="#i-download"/></svg></span>
          <span class="menu-text"><b>백업 파일 저장</b><small>JSON 파일로 내보내기</small></span>
          <svg class="chev"><use href="#i-right"/></svg>
        </button>
        <label class="menu-row">
          <span class="menu-ico green"><svg><use href="#i-upload"/></svg></span>
          <span class="menu-text"><b>백업 파일 불러오기</b><small>지금 데이터를 덮어써요</small></span>
          <svg class="chev"><use href="#i-right"/></svg>
          <input type="file" id="import-input" accept="application/json,.json" hidden>
        </label>
      </div>
      <p class="hint">데이터는 이 기기의 브라우저에만 저장돼요. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 백업해 두세요.</p>

      <p class="group-label">데이터</p>
      <div class="card menu">
        <button class="menu-row danger" id="reset-btn">
          <span class="menu-ico red"><svg><use href="#i-trash"/></svg></span>
          <span class="menu-text"><b>모든 데이터 삭제</b><small>항목과 납부 기록을 모두 지워요</small></span>
        </button>
      </div>
      <p class="hint center" id="app-version"></p>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="month"><svg><use href="#i-cal"/></svg>이번 달</button>
    <button class="tab" data-view="items"><svg><use href="#i-list"/></svg>고정지출</button>
    <button class="tab" data-view="settings"><svg><use href="#i-gear"/></svg>설정</button>
  </nav>

  <!-- ───── 추가/수정 시트 ───── -->
  <dialog id="item-dialog" class="sheet">
    <form id="item-form" method="dialog" novalidate>
      <div class="grabber"></div>
      <div class="sheet-head">
        <h2 id="dialog-title">고정지출 추가</h2>
        <button type="button" class="icon-btn ghost" data-close aria-label="닫기"><svg><use href="#i-x"/></svg></button>
      </div>

      <div class="name-row">
        <button type="button" class="avatar lg" id="icon-toggle" aria-label="아이콘 바꾸기"></button>
        <input name="name" class="name-input" required maxlength="40" placeholder="이름 (예: 월세, 넷플릭스)" autocomplete="off">
      </div>

      <div class="icon-picker" id="icon-picker" hidden>
        <div class="emoji-grid" id="emoji-grid"></div>
        <div class="color-row" id="color-row"></div>
      </div>

      <label class="amount-field">
        <span class="field-label">금액</span>
        <span class="amount-wrap">
          <input name="amount" inputmode="numeric" placeholder="0" autocomplete="off">
          <span class="unit">원</span>
        </span>
      </label>

      <div class="field">
        <span class="field-label">주기</span>
        <div class="segmented">
          <label><input type="radio" name="cycle" value="monthly" checked><span>매월</span></label>
          <label><input type="radio" name="cycle" value="yearly"><span>매년</span></label>
        </div>
      </div>

      <div class="field-row">
        <label class="field" id="month-field" hidden>
          <span class="field-label">결제 월</span>
          <select name="month"></select>
        </label>
        <label class="field">
          <span class="field-label">결제일</span>
          <select name="day"></select>
        </label>
      </div>

      <div class="field">
        <span class="field-label">분류</span>
        <div class="chips" id="category-chips"></div>
        <input name="category" maxlength="20" placeholder="직접 입력" autocomplete="off">
      </div>

      <div class="field">
        <span class="field-label">결제수단</span>
        <div class="chips" id="method-chips"></div>
        <input name="method" maxlength="20" placeholder="예: 신한카드, 국민은행" autocomplete="off">
      </div>

      <div class="field-row">
        <label class="field">
          <span class="field-label">시작 월</span>
          <input type="month" name="start">
        </label>
        <label class="field">
          <span class="field-label">종료 월 <em>선택</em></span>
          <input type="month" name="end">
        </label>
      </div>

      <label class="field">
        <span class="field-label">메모 <em>선택</em></span>
        <input name="memo" maxlength="100" placeholder="계좌번호, 해지 방법 등" autocomplete="off">
      </label>

      <div class="toggle-card">
        <label class="switch-row">
          <span><b>자동이체</b><small>목록에 자동이체로 표시돼요</small></span>
          <input type="checkbox" name="auto" class="switch">
        </label>
        <label class="switch-row">
          <span><b>사용 중</b><small>끄면 이번 달 목록에서 빠져요</small></span>
          <input type="checkbox" name="active" class="switch" checked>
        </label>
      </div>

      <div class="sheet-cta">
        <button type="button" class="btn subtle" id="delete-btn" hidden>삭제</button>
        <button type="submit" class="btn primary grow">저장하기</button>
      </div>
    </form>
  </dialog>

  <!-- ───── 이번 달 항목 시트 ───── -->
  <dialog id="pay-dialog" class="sheet">
    <form id="pay-form" method="dialog" novalidate>
      <div class="grabber"></div>
      <div class="sheet-head end">
        <button type="button" class="icon-btn ghost" data-close aria-label="닫기"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="pay-head">
        <div class="avatar xl" id="pay-avatar"></div>
        <h2 id="pay-title"></h2>
        <p id="pay-desc"></p>
      </div>
      <label class="amount-field">
        <span class="field-label" id="pay-amount-label">이번 달 금액</span>
        <small class="field-desc">이 달에만 적용돼요. 매달 바뀌었다면 수정을 눌러 주세요.</small>
        <span class="amount-wrap">
          <input name="amount" inputmode="numeric" autocomplete="off">
          <span class="unit">원</span>
        </span>
        <small class="field-hint" id="pay-hint"></small>
      </label>
      <p class="memo-box" id="pay-memo" hidden></p>
      <div class="sheet-cta">
        <button type="button" class="btn subtle" id="pay-edit-item"><svg><use href="#i-edit"/></svg>수정</button>
        <button type="submit" class="btn primary grow">저장하기</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
